<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Bir yazma isteğinin yolculuğu: istek kimlik doğrulama ve hız sınırından, idempotency kontrolünden, RLS ile korunan veritabanı işleminden geçer; olay aynı işlemde outbox'a yazılır, worker dış sisteme iletir ve imzalı webhook gönderilir. Örnek akış.">
<title>Bir yazma isteğinin yolculuğu</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<radialGradient id="isik" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.2"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<pattern id="nokta" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<filter id="parla" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="cerceve"><rect width="1200" height="540" rx="18"/></clipPath>
<clipPath id="y1"><rect x="64.0" y="96" height="22" width="0"><animate attributeName="width" dur="13s" repeatCount="indefinite" values="0;0;264.4;264.4;0" keyTimes="0;0.020;0.100;0.975;1"/></rect></clipPath><clipPath id="y2"><rect x="97.6" y="120" height="22" width="0"><animate attributeName="width" dur="13s" repeatCount="indefinite" values="0;0;264.4;264.4;0" keyTimes="0;0.110;0.190;0.975;1"/></rect></clipPath><clipPath id="y4"><rect x="64.0" y="192" height="22" width="0"><animate attributeName="width" dur="13s" repeatCount="indefinite" values="0;0;222.4;222.4;0" keyTimes="0;0.660;0.740;0.975;1"/></rect></clipPath>
</defs>
<g clip-path="url(#cerceve)">
<rect width="1200" height="540" fill="url(#bg)"/>
