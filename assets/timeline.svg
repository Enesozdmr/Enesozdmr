<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Kariyer çizelgesi. 2022: yazılım mühendisliği stajları. 2023: sağlık teknolojilerinde backend mühendisliği. 2024: veri merkezinde NOC uzmanlığı. 2026: Pandassist'te backend ve platform mühendisliği.">
  <title>Kariyer çizelgesi</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="hat" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1020" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#39d3bb"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <radialGradient id="isik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nokta" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="cerceve"><rect width="1200" height="270" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#cerceve)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <circle cx="1020" cy="120" r="260" fill="url(#isik)"/>
    <rect width="1200" height="270" fill="url(#nokta)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <text x="64" y="58" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2" fill="#7ee787">YOL</text>

  <!-- Hat -->
  <path d="M150 128 H1020" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 128 H1020" stroke="url(#hat)" stroke-width="3" stroke-linecap="round" stroke-dasharray="870" stroke-dashoffset="870">
    <animate attributeName="stroke-dashoffset" from="870" to="0" dur="2.4s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0.1 0.3 1"/>
  </path>
  <!-- Hat boyunca akan ışık -->
  <circle r="4" fill="#f0f6fc" opacity="0">
    <animateMotion dur="5s" begin="3s" repeatCount="indefinite" path="M150 128 H1020" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="5s" begin="3s" repeatCount="indefinite" values="0;0.9;0.9;0;0" keyTimes="0;0.05;0.55;0.6;1"/>
  </circle>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 2022 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
      <circle cx="150" cy="128" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
      <text x="150" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#79c0ff">2022</text>
      <text x="150" y="166" font-size="17" font-weight="700" fill="#f0f6fc">Stajlar</text>
      <text x="150" y="190" font-size="13.5" fill="#8b949e">.NET, Flutter,</text>
      <text x="150" y="209" font-size="13.5" fill="#8b949e">sunucu operasyonu</text>
    </g>
    <!-- 2023 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/>
      <circle cx="440" cy="128" r="8" fill="#0d1117" stroke="#4fbfd8" stroke-width="3"/>
      <text x="440" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#79c0ff">2023</text>
      <text x="440" y="166" font-size="17" font-weight="700" fill="#f0f6fc">Backend Engineer</text>
      <text x="440" y="190" font-size="13.5" fill="#8b949e">Sağlık teknolojileri:</text>
      <text x="440" y="209" font-size="13.5" fill="#8b949e">telemedicine, klinik platformu</text>
    </g>
    <!-- 2024 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
      <circle cx="730" cy="128" r="8" fill="#0d1117" stroke="#39d3bb" stroke-width="3"/>
      <text x="730" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#79c0ff">2024</text>
      <text x="730" y="166" font-size="17" font-weight="700" fill="#f0f6fc">NOC Specialist</text>
      <text x="730" y="190" font-size="13.5" fill="#8b949e">Veri merkezi: sunucu,</text>
      <text x="730" y="209" font-size="13.5" fill="#8b949e">ağ, 7/24 izleme</text>
    </g>
    <!-- 2026 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
      <circle cx="1020" cy="128" r="8" fill="none" stroke="#d2a8ff" stroke-width="2">
        <animate attributeName="r" values="8;22" dur="2.2s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.8;0" dur="2.2s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="128" r="8" fill="#d2a8ff" stroke="#d2a8ff" stroke-width="3"/>
      <text x="1020" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#d2a8ff">2026 · şimdi</text>
      <text x="1020" y="166" font-size="17" font-weight="700" fill="#f0f6fc">Backend &amp; Platform Engineer</text>
      <text x="1020" y="190" font-size="13.5" fill="#8b949e">Pandassist: çok kiracılı</text>
      <text x="1020" y="209" font-size="13.5" fill="#8b949e">B2B operasyon platformu</text>
    </g>
  </g>
</svg>
