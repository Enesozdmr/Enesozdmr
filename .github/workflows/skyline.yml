name: Katkı silueti

on:
  schedule:
    - cron: "17 3 * * *" # her gün 06:17 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyline
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Görseli üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/skyline.py "${{ github.repository_owner }}" assets/katki-sehri.svg

      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/katki-sehri.svg
          git diff --cached --quiet || git commit -m "chore: katkı silueti güncellendi"
          git push
